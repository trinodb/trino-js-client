name: IT tests
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  it-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: trino
      - name: Deploy trino
        run: kubectl apply -f tests/it/trino.yml
      - name: Wait for pods to be ready
        run: kubectl wait --for=condition=ready pods -n trino-system --all --timeout=120s
      - name: Test
        run: |
          kubectl -n trino-system port-forward svc/trino 8080:8080 > /dev/null &
          sleep 10 # give it a little bit more time to start
          yarn test:it --testTimeout=60000

  # Guards the compatibility claim in the README. The client protocol is
  # stable, so an older Trino is expected to keep working; this proves it
  # rather than asserting it. Kept as its own job rather than a matrix on
  # it-tests, so the existing check name does not change.
  it-tests-older-trino:
    runs-on: ubuntu-latest
    env:
      TRINO_VERSION: "440"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: trino
      - name: Deploy trino
        # The manifest carries two settings that older releases reject, so they
        # are stripped here rather than weakening the primary run:
        # discovery.type is not recognised by older releases and Trino fails
        # fast on unused configuration, and G1NumCollectionsKeepPinned
        # needs a newer JDK than 440 ships, which stops the JVM starting.
        run: |
          sed -i \
            -e "s|trinodb/trino:latest|trinodb/trino:${TRINO_VERSION}|g" \
            -e "/discovery\.type=/d" \
            -e "/G1NumCollectionsKeepPinned/d" \
            tests/it/trino.yml
          kubectl apply -f tests/it/trino.yml
      - name: Wait for pods to be ready
        # Longer than the primary run, since an old tag is not in the runner
        # image cache and has to be pulled.
        run: kubectl wait --for=condition=ready pods -n trino-system --all --timeout=240s
      - name: Test
        run: |
          kubectl -n trino-system port-forward svc/trino 8080:8080 > /dev/null &
          sleep 10 # give it a little bit more time to start
          yarn test:it --testTimeout=60000
